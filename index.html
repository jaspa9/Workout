<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120c">
  <meta name="description" content="Atlas & Oak — a private, offline-friendly strength and cardio workout tracker with RIR and smart workout generation.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlas & Oak">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Atlas & Oak — Iron Gold Edition 2.1</title>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand" aria-label="Atlas & Oak workout tracker">
        <div class="brand-icon" aria-hidden="true"><svg width="27" height="27" viewBox="0 0 32 32" fill="none"><path d="M16 24V12M16 18 9 12M16 15l8-7M8 12l-3-4 6-1-1-6 6 4 6-4v6l5 2-4 6-7 7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 26h26M6 23v6M26 23v6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></div>
        <div><strong>atlas & oak</strong><span>STRENGTH · CONSISTENCY · PROGRESS</span></div>
      </div>
      <div class="header-right"><span class="local-pill"><span class="status-dot"></span> Private & local</span><button class="icon-button" title="Settings" aria-label="Settings" data-action="nav" data-tab="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.76l.06.06-1.93 1.93-.06-.06a1.6 1.6 0 0 0-1.76-.32l-.09.04a1.6 1.6 0 0 0-.95 1.47V20h-2.73v-.12a1.6 1.6 0 0 0-.95-1.47l-.09-.04a1.6 1.6 0 0 0-1.76.32l-.06.06-1.93-1.93.06-.06A1.6 1.6 0 0 0 7.86 15l-.04-.09A1.6 1.6 0 0 0 6.35 14H6.2v-2.73h.15a1.6 1.6 0 0 0 1.47-.95l.04-.09a1.6 1.6 0 0 0-.32-1.76l-.06-.06L9.4 6.48l.06.06a1.6 1.6 0 0 0 1.76.32l.09-.04a1.6 1.6 0 0 0 .95-1.47V5.2h2.73v.15a1.6 1.6 0 0 0 .95 1.47l.09.04a1.6 1.6 0 0 0 1.76-.32l.06-.06 1.93 1.93-.06.06a1.6 1.6 0 0 0-.32 1.76l.04.09a1.6 1.6 0 0 0 1.47.95h.12V14h-.12a1.6 1.6 0 0 0-1.47.95l-.04.09Z" transform="translate(-.6 -.6)"/></svg></button></div>
    </header>
    <main id="app" class="page" tabindex="-1"></main>
  </div>
  <nav id="navigation" class="bottom-nav" aria-label="Main navigation">
    <button data-action="nav" data-tab="dashboard" class="nav-link" aria-label="Dashboard"><span class="nav-icon" aria-hidden="true">⌂</span><span>Home</span></button>
    <button data-action="nav" data-tab="workout" class="nav-link" aria-label="Workout"><span class="nav-icon" aria-hidden="true">✚</span><span>Workout</span></button>
    <button data-action="nav" data-tab="daily" class="nav-link" aria-label="Daily Fundamentals"><span class="nav-icon" aria-hidden="true">✓</span><span>Daily</span></button>
    <button data-action="nav" data-tab="progress" class="nav-link" aria-label="Progress"><span class="nav-icon" aria-hidden="true">⌁</span><span>Progress</span></button>
    <button data-action="nav" data-tab="history" class="nav-link" aria-label="History"><span class="nav-icon" aria-hidden="true">▤</span><span>History</span></button>
  </nav>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="progress-photo-input" accept="image/*" hidden>
  <input type="file" id="restore-file" accept="application/json,.json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
